*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#2c1840;font-family:system-ui,-apple-system,sans-serif;color:#fff}button,input{font:inherit}button{touch-action:manipulation;border:1px solid #ffffff40;border-radius:16px;background:#38243bd9;color:#fff;padding:12px 16px;font-weight:750}button:disabled{opacity:.45}#stage{position:fixed;inset:0;touch-action:none}canvas{display:block}.top{position:fixed;z-index:2;top:calc(12px + env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;gap:10px;pointer-events:none}.chip{background:#281b2ce0;border-radius:17px;padding:12px 16px;font-weight:850;backdrop-filter:blur(8px)}.top button{pointer-events:auto;font-size:20px}.progress{position:fixed;right:14px;top:100px;width:31px;height:210px;background:#302039af;border-radius:20px;padding:12px;display:flex;align-items:flex-end}.progress:before{content:'';position:absolute;top:14px;bottom:24px;width:4px;background:#ffffff55;border-radius:8px}.progress i{position:absolute;bottom:24px;width:4px;background:#c75eff;border-radius:8px;height:0}.progress b{position:absolute;bottom:2px;left:7px;font-size:16px}#phase{position:fixed;top:76px;left:14px;font-size:11px;background:#35243dd9;border-radius:9px;padding:6px 10px}.bottom{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;gap:10px}.steer{width:74px;height:64px;font-size:27px;background:#ffffff22;backdrop-filter:blur(8px);user-select:none}.centre{text-align:center;font-size:12px}.centre button{font-size:11px;padding:8px 12px;margin-top:7px}#toast{position:fixed;z-index:7;top:140px;left:50%;transform:translateX(-50%);max-width:85%;width:max-content;line-height:1.5;padding:12px 16px;background:#2c163de8;border:1px solid #c382e9;border-radius:13px;font-size:12px;display:none}.panel{position:fixed;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92%,390px);max-height:85dvh;overflow:auto;padding:24px;background:#291a36ef;border:1px solid #a777bd80;border-radius:26px;box-shadow:0 15px 80px #15061b66;backdrop-filter:blur(16px)}.panel[hidden]{display:none}.panel h1{font-size:25px;margin:0 0 10px}.panel p{font-size:12px;line-height:1.65;color:#d8c6e4}.actions{display:grid;gap:10px}.primary{background:#a750ce;border-color:#c987e6}.join{display:flex;gap:8px}.join input{min-width:0;width:100%;background:#fff0f9;color:#47264f;border:0;border-radius:14px;padding:12px;text-transform:uppercase;letter-spacing:3px}#roomCode{font-size:30px;letter-spacing:5px;margin:12px 0;color:#f3c0ff;text-align:center}#members{font-size:13px;margin:12px 0}.roomActions{display:flex;gap:8px;margin:10px 0}.roomActions button{flex:1;font-size:12px}.muted{opacity:.75}.stat{display:flex;justify-content:space-between;font-size:14px;margin:12px 0}.tiny{font-size:10px;color:#cab5d5}#error{display:none;background:#271632;padding:30px;position:fixed;inset:0;z-index:10;place-content:center;text-align:center}a{color:#dba7fa}#fps{position:fixed;bottom:96px;right:12px;opacity:.55;font-size:9px}#netStatus{font-size:10px;color:#e4d6ee}#leave{margin-top:12px;width:100%}#resultList{font-size:13px;line-height:2}</style></head><body><div id="stage"></div><div class="top"><div class="chip">⏱ <span id="time">0.0</span>s</div><button id="pause" aria-label="일시정지">Ⅱ</button></div><div id="phase">지상 코스</div><div class="progress" aria-label="진행률"><i id="progress"></i><b>⚑</b></div><div id="toast" role="status"></div><div id="fps"></div><div class="bottom"><button class="steer" id="left" aria-label="왼쪽 이동">‹</button><div class="centre"><div id="score">◆ 0</div><div id="netStatus">혼자 플레이</div><button id="view">시점 · 1인칭</button><button id="menu">메뉴</button></div><button class="steer" id="right" aria-label="오른쪽 이동">›</button></div>
