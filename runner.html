<section class="panel" id="lobby"><h1>벨켓 런</h1><p>자동으로 전진합니다. 왼쪽 아래 조이스틱이나 화면 드래그로 바위를 피하세요.<br>지상 → 구멍 낙하 → 지하 동굴<br>민트색 화살표 구역: 3초 동안 속도 ×1.5</p><div class="actions"><button class="primary" id="solo">혼자 달리기</button><button id="host">최대 5명 · 방 만들기</button><div class="join"><input id="code" maxlength="6" placeholder="방 코드" aria-label="방 코드"><button id="join">접속</button></div></div><div id="room" hidden><div id="roomCode"></div><div id="members"></div><div class="roomActions"><button id="share">초대 링크 공유</button><button id="ready" hidden class="primary">준비 완료</button><button id="start" class="primary">함께 출발</button></div><p id="roomHint">방장 포함 최대 5명 · 친구들은 준비 완료를, 방장은 함께 출발을 누르세요. 방장은 화면을 켜 두세요.</p></div><button id="leave" hidden>방 나가기</button><p class="tiny">멀티 접속은 휴대폰 간 직접 연결 방식입니다. 일부 Wi-Fi·통신망에서는 연결이 제한될 수 있습니다.</p><a class="tiny" href="./plinko-3d-v05.html">이전 관전 레이스</a></section>
